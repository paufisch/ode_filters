site_name: ODE Filters
site_url: https://paufisch.github.io/ode_filters/
repo_url: https://github.com/paufisch/ode_filters
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-header.svg
  favicon: assets/icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Top-level sections become header tabs, so the sidebar lists one section.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      # Fail the (strict) build when a notebook cell raises, instead of
      # rendering the traceback into the page.
      allow_errors: false
      # Title notebook pages from the nav, not from their first heading.
      ignore_h1_titles: true
      # Cells tagged "hide-input" show only their output (e.g. a figure).
      remove_tag_config:
        remove_input_tags:
          - hide-input
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            heading_level: 3
            # The API pages list each object explicitly (grouped by topic), so
            # every object gets its own heading and no package-level summary.
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            summary: false
            members_order: alphabetical
            filters: ["!^_"]
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            docstring_section_style: table
            merge_init_into_class: true
            group_by_category: true
            show_category_heading: false
            show_source: false
            show_if_no_docstring: false
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Objects (h3) appear in the page TOC; their methods (h4) do not.
      toc_depth: 3
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Getting started:
      - What is a probabilistic ODE solver?: probabilistic-ode-solvers.md
      - Quickstart: examples/quickstart.ipynb
      - How it compares: comparison.md
      - Migrating from 0.7: migration.md
  - Tutorials:
      - Solving ODEs:
          - Multi-dimensional systems: examples/examples.ipynb
          - Second-order systems: examples/second-order-systems.ipynb
          - Conservation laws: examples/conservation-laws.ipynb
          - Calibration modes: examples/calibration-modes.ipynb
      - Inference from data:
          - Parameter estimation: examples/parameter-estimation.ipynb
          - Recovering a hidden input: examples/hidden-input.ipynb
          - Bayesian posterior sampling: examples/bayesian-sampling.ipynb
  - Guides:
      - How to choose: how-to-choose.md
      - Linearization schemes: corrections.md
      - Diffusion calibration: calibration.md
      - Adaptive step-size control: adaptive-steps.ipynb
      - Notation & conventions: notation.md
      - Sharp bits & FAQ: sharp-bits.md
  - API reference:
      - api/index.md
      - Filters: api/filters/index.md
      - Linearization: api/linearization/index.md
      - Information: api/information/index.md
      - Priors: api/priors/index.md
      - Calibration: api/calibration/index.md
      - Inference: api/inference/index.md
      - Gaussian algebra: api/gaussian/index.md
