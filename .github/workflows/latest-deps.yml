# Tests against the newest dependency versions that pyproject.toml allows.
#
# uv.lock pins what the CI workflow tests -- jax sits at its lower bound -- so a
# breaking release of a dependency would otherwise reach users before it reaches
# the test suite. This workflow re-resolves every dependency to its newest
# allowed version (`uv sync --upgrade`; the upgraded lock stays on the runner
# and is never committed) and runs the suite: weekly, on demand, and on pull
# requests. A failure here that the CI workflow does not show comes from a new
# upstream release, not from the pull request.
name: Latest dependencies

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: latest-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (latest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Resolve and install the newest allowed versions
        run: uv sync --upgrade --group dev
      - name: Show the resolved versions
        run: uv pip list
      # Warnings are errors ([tool.pytest.ini_options]), so a new deprecation
      # fails here first. Coverage is the CI workflow's concern.
      - name: Run tests
        run: uv run pytest --no-cov
