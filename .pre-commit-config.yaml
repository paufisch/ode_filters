repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        # Lint the notebooks too (formatting them is left to their authors).
        types_or: [python, pyi, jupyter]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe: check syntax only, so mkdocs.yml's !!python/name tags
        # (Material's icon/emoji extension) are allowed.
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
  # NOTE: pyupgrade is intentionally omitted -- ruff's `UP` rules (selected in
  # pyproject.toml) already perform the same py313+ rewrites in a single pass.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.2
    hooks:
      - id: nbstripout
        # Drop IDE/venv-specific kernel metadata so notebook diffs stay stable.
        # Strip the whole kernelspec: nbformat requires display_name if it exists.
        args: ["--extra-keys", "metadata.kernelspec metadata.language_info"]
  - repo: local
    hooks:
      # Package source stays ASCII (CONTRIBUTING: "ASCII only -- no Unicode math
      # symbols"): such symbols render inconsistently across terminals, help()
      # and the API docs.
      - id: ascii-only-source
        name: ASCII-only package source
        language: pygrep
        entry: '[^\x00-\x7F]'
        files: ^ode_filters/.*\.py$
      # Static type checking. Run through `uv` (rather than a pinned mirror) so
      # the pyright version is single-sourced from the locked dev dependencies.
      # Checks `ode_filters` and `benchmarks` per [tool.pyright] -- hence
      # pass_filenames: false; `types: [python]` only triggers it on .py changes.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
