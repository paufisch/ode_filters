repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
  # NOTE: pyupgrade is intentionally omitted -- ruff's `UP` rules (selected in
  # pyproject.toml) already perform the same py313+ rewrites in a single pass.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.2
    hooks:
      - id: nbstripout
  - repo: local
    hooks:
      # Static type checking. Run through `uv` (rather than a pinned mirror) so
      # the pyright version is single-sourced from the locked dev dependencies.
      # Checks the whole `ode_filters` package per [tool.pyright] -- hence
      # pass_filenames: false; `types: [python]` only triggers it on .py changes.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
